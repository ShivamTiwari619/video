  const f2=f*f,f3=f2*f;out.push(.5*((2*b)+(-a+c)*f+(2*a-5*b+4*c-d)*f2+(-a+3*b-3*c+d)*f3));}return out;}
function pathTo(xs,ys,p){const n=xs.length;const k=Math.max(1,Math.floor(p*(n-1)));let d='M'+xs[0].toFixed(1)+','+ys[0].toFixed(1);
