<script>
// ---------- math ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const PI=Math.PI;
const E={
 lin:t=>t,
 inQuad:t=>t*t, outQuad:t=>1-(1-t)*(1-t),
 inCubic:t=>t*t*t, outCubic:t=>1-Math.pow(1-t,3),
 inOutCubic:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
 inOutQuart:t=>t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2,
 inOutQuint:t=>t<.5?16*t**5:1-Math.pow(-2*t+2,5)/2,
 outQuint:t=>1-Math.pow(1-t,5), inQuart:t=>t**4, outQuart:t=>1-Math.pow(1-t,4),
 outExpo:t=>t>=1?1:1-Math.pow(2,-10*t),
 outBack:(t,s=1.70158)=>1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2),
 inBack:(t,s=1.70158)=>(s+1)*t*t*t-s*t*t,
};
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const tw=(t,a,b,v0,v1,e=E.inOutCubic)=>lerp(v0,v1,e(prog(t,a,b)));
function spring(t,t0,f=2,z=.4){const x=t-t0;if(x<=0)return 0;const w=2*PI*f,wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*x)*(Math.cos(wd*x)+(z*w/wd)*Math.sin(wd*x));}
function wob(t,t0,f=3,d=5,amp=1){const x=t-t0;if(x<0)return 0;return amp*Math.exp(-d*x)*Math.sin(2*PI*f*x);}
function pulse(t,t0,rise=.06,decay=4){const x=t-t0;if(x<0)return 0;if(x<rise)return E.outQuad(x/rise);return Math.exp(-decay*(x-rise));}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const $=id=>document.getElementById(id);
function el(tag,cls,parent,style){const e=document.createElement(tag);if(cls)e.className=cls;if(style)Object.assign(e.style,style);if(parent)parent.appendChild(e);return e;}
function css(e,o){for(const k in o)e.style[k]=o[k];}

// ---------- timeline constants ----------
const CFG=window.CFG; const MODE=(location.search.match(/mode=(\w)/)||[])[1]||'A';
const SHIFT=CFG.SHIFT, INTRO_OUT=3.0+SHIFT, PIN_IN=3.25+SHIFT, STEP0=4.2+SHIFT, DROP=4.0+SHIFT;
const DUR=CFG.DUR;
const S=k=>{let s=STEP0;for(let i=0;i<k-1;i++)s+=DUR[i];return s;};
const T=k=>S(k+1)-0.2;
const TAP=k=>S(k+1)-0.55;
const OUT=S(8)-0.2, END=OUT+CFG.OUTRO;
const TITLES=["Enter  Mobile  Number","Verify Mobile Number","Create Login Pin","Confirm Login Pin","Explore MarketWolf Benefits","Meet Your Voice Guide","Complete Your KYC"];
const TRANS=["push","push","fade","slideUp","push","reveal"];
const BOTTOM=["#fff","#fff","#fff","#fff","#A265FF","#ccc","#fff"];

// ---------- build: intro ----------
const intro=$('intro');
const logo=el('img','abs',intro,{left:'394px',top:'61px',width:'111px',height:'100px',transformOrigin:'55px 100px'});logo.src='assets/logo.png';

  return {ln,chars};
}
const iA=letterLine(intro,'MarketWolf',652,70.41,500);
const iB=letterLine(intro,'Sign-Up  Journey',739,70.41,500);

// ---------- build: titles ----------
const titles=$('titles');
const lab=el('div','line',titles,{top:'70px',fontSize:'32px',fontWeight:400,lineHeight:'39px',height:'39px',opacity:.8});
const labChars=[];for(const c of 'Step 0'){const s=el('span','ch',lab);s.textContent=c;labChars.push(s);}
const rollBox=el('span','ch',lab,{height:'39px',overflow:'hidden',verticalAlign:'top',position:'relative',width:'20px'});
const roll=el('span','',rollBox,{position:'absolute',left:0,top:0,display:'block',width:'20px'});
for(let i=1;i<=7;i++){const d=el('div','',roll,{height:'39px',textAlign:'center'});d.textContent=i;}
labChars.push(rollBox);
const tLines=TITLES.map(s=>letterLine(titles,s,128,42,500));

// ---------- build: screens ----------
const screen=$('screen'), fx=$('fx');
const scr=[];
function crop(parent,n,x,y,w,h,extra={}){return el('div','crop',parent,Object.assign({left:x+'px',top:y+'px',width:w+'px',height:h+'px',backgroundImage:`url(assets/s${n}.png)`,backgroundPosition:`-${x}px -${y}px`},extra));}
for(let i=1;i<=7;i++){
  const d=el('div','scr abs',screen,{background:BOTTOM[i-1],visibility:'hidden'});
  crop(d,i,0,0,636,1295.5);
  scr[i]=d;
}
const O={};
// s1: typed number
O.cover1=el('div','ov',scr[1],{left:'163px',top:'582px',width:'22px',height:'48px',background:'#fff'});
O.typed=el('div','ov',scr[1],{left:'170px',top:'586px',height:'40px',font:'500 28px/40px Sat',color:'#161616',whiteSpace:'pre',letterSpacing:'.3px'});
const NUM='97025 42629';O.typedCh=[];for(const c of NUM){const s=el('span','ch',O.typed);s.textContent=c;O.typedCh.push(s);}
O.caret=el('span','ch',O.typed,{width:'2.5px',height:'32px',background:'#8C3FFE',verticalAlign:'middle',marginLeft:'2px'});

// s2: otp
const BX=[95.5,243.5,392.5,540.5];
O.otp=['4','8','2','7'].map((c,j)=>{const s=el('div','ov',scr[2],{left:(BX[j]-40)+'px',top:'528px',width:'80px',height:'60px',font:'700 40px/60px Sat',color:'#111',textAlign:'center'});s.textContent=c;return s;});
O.b2=btn(scr[2],37,835,561,78,'Continue');
// s3/s4: pin dots

O.pin4=BX.map(x=>el('div','ov',scr[4],{left:(x-10)+'px',top:'326px',width:'20px',height:'20px',borderRadius:'50%',background:'#111'}));

// s6: rings, orb, pill, button
O.rings=[0,1,2].map(()=>el('div','ov',scr[6],{left:'318px',top:'612px',width:'0',height:'0',border:'3px solid #9B5CFF',borderRadius:'50%'}));
O.orbBg=el('div','ov',scr[6],{left:'138px',top:'432px',width:'360px',height:'360px',borderRadius:'50%',background:'#fff'});
O.orb=crop(scr[6],6,143,437,350,350,{borderRadius:'50%'});
O.pill=el('div','ov',scr[6],{left:'34px',top:'902px',width:'272px',height:'58px',border:'3px solid #8C3FFE',borderRadius:'8px',background:'rgba(140,63,254,.08)',boxSizing:'border-box',opacity:0});
O.b6=btn(scr[6],35,1071,566,82,'Continue');
// s7: flag slices, kyc pop, coin bounce, cta flash
O.flagCover=el('div','ov',scr[7],{left:'291px',top:'200px',width:'74px',height:'84px',background:'#fff'});
O.flag=[];const FX0=291,FW=72,NS=12;for(let i=0;i<NS;i++){const x=FX0+i*FW/NS;O.flag.push(crop(scr[7],7,x,203,FW/NS+.6,80));}
O.kyc=crop(scr[7],7,118,376,400,62);
O.coinCover=el('div','ov',scr[7],{left:'272px',top:'632px',width:'92px',height:'98px',background:'#fff'});
O.coin=crop(scr[7],7,274,634,88,94);
O.cta7=el('div','ov',scr[7],{left:'40px',top:'1132px',width:'556px',height:'77px',background:'#fff',borderRadius:'8px',opacity:0});
// spotlight
O.spot=el('div','ov',screen,{left:'0',top:'0',width:'636px',height:'1400px',opacity:0,zIndex:5,pointerEvents:'none'});
// sheen
O.sheen=el('div','ov',screen,{left:'-400px',top:'-250px',width:'240px',height:'1900px',background:'linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.7),rgba(255,255,255,0))',mixBlendMode:'soft-light',opacity:0});

// ---------- exploded layer (draft B) ----------
const POP=[0,1].map(()=>{const o=el('div','ov',fx,{overflow:'hidden',opacity:0,willChange:'transform'});const inner=el('div','ov',o,{left:0,top:0});return {o,inner};});
const grain=el('div','abs',$('stage'),{width:'900px',height:'1600px',backgroundImage:'url(assets/grain.png)',opacity:MODE==='B'?.055:0,mixBlendMode:'overlay',pointerEvents:'none',zIndex:20});
// ---------- taps ----------
const KP1={'1':[106,1012],'2':[318,1012],'3':[530,1012],'4':[106,1096],'5':[318,1096],'6':[530,1096],'7':[106,1180],'8':[318,1180],'9':[530,1180],'0':[318,1265]};
const kp=(rows)=>{const o={};const c=[106,318,530];[1,2,3,4,5,6,7,8,9].forEach((n,i)=>o[n]=[c[i%3],rows[Math.floor(i/3)]]);o[0]=[318,rows[3]];return o;};
const KP2=kp([995,1077,1159,1241]), KP3=kp([993,1076,1158,1240]);
const TAPS=[]; // {t,x,y,big,col}
const TYPE1=[];
'9702542629'.split('').forEach((d,i)=>{const t=S(1)+CFG.TYPE1+i*0.11;TAPS.push({t,x:KP1[d][0],y:KP1[d][1],big:false,d});TYPE1.push(t);});
TAPS.push({t:TAP(1),x:318,y:888,big:true});
const OTPT=CFG.OTP.map(u=>S(2)+u);['4','8','2','7'].forEach((d,i)=>TAPS.push({t:OTPT[i],x:KP2[d][0],y:KP2[d][1],big:false,d}));
TAPS.push({t:TAP(2),x:318,y:874,big:true});
const PIN3=CFG.PIN3.map(u=>S(3)+u);['1','3','5','8'].forEach((d,i)=>TAPS.push({t:PIN3[i],x:KP3[d][0],y:KP3[d][1],big:false,d}));
TAPS.push({t:TAP(3),x:318,y:868,big:true});
const PIN4=CFG.PIN4.map(u=>S(4)+u);['1','3','5','8'].forEach((d,i)=>TAPS.push({t:PIN4[i],x:KP3[d][0],y:KP3[d][1],big:false,d}));
TAPS.push({t:TAP(4),x:318,y:868,big:true});
TAPS.push({t:TAP(5),x:318,y:1225,big:true});
TAPS.push({t:S(6)+CFG.ENG,x:170,y:931,big:false,nocell:true});
TAPS.push({t:TAP(6),x:318,y:1112,big:true});
TAPS.push({t:TAP(7),x:318,y:1170,big:true,col:'#C2F53B'});
const POOL=[];for(let i=0;i<6;i++){const tp=el('div','tap',fx);const cell=el('div','cell',tp);const ring=el('div','ring',tp);const dot=el('div','dot',tp);POOL.push({tp,cell,ring,dot});}

const bigTaps=TAPS.filter(t=>t.big);
// ---------- render ----------
const view=$('view'),stage=$('stage'),glow=$('glow'),phone=$('phone');
stage.style.transform='scale(1.2)';
function swell(t,t0,up=.25,down=1.6){const x=t-t0;if(x<0)return 0;if(x<up)return E.inOutCubic(x/up);return Math.exp(-down*(x-up));}
function boost(t){let b=0;for(let k=1;k<=5;k++)b+=swell(t,T(k)+.1);b+=swell(t,PIN_IN,.4,1.4)+swell(t,OUT+.2,.4,1.2);return b;}
const bump=(t,a,d)=>{const p=prog(t,a,a+d);return Math.sin(PI*E.inOutCubic(p));};

function screenStates(t){
  let cur=1; for(let k=1;k<=6;k++) if(t>=T(k)) cur=k+1;
  const st={}; for(let i=1;i<=7;i++) st[i]={vis:false,x:0,y:0,s:1,b:1,op:1,clip:null,z:1};
  st[cur].vis=true;
  for(let k=1;k<=6;k++){const x=t-T(k);if(x<0||x>.85)continue;const A=st[k],B=st[k+1];const ty=TRANS[k-1];
    A.vis=true;B.vis=true;A.z=1;B.z=2;
    if(ty==='push'){const q=E.inOutQuart(prog(x,0,.62));B.x=636*(1-q);A.x=-190*q;A.b=1-.3*q;if(q>=1)A.vis=false;}
    else if(ty==='fade'){const q=E.inOutCubic(prog(x,0,.55));B.op=q;B.s=lerp(1.035,1,q);A.s=lerp(1,.985,q);if(q>=1)A.vis=false;}
    else if(ty==='slideUp'){const q=E.inOutQuart(prog(x,0,.66));B.y=1400*(1-q);A.y=-240*q;A.b=1-.3*q;if(q>=1)A.vis=false;}
    else if(ty==='reveal'){const q=E.inOutCubic(prog(x,0,.8));B.clip=`circle(${(q*1520).toFixed(1)}px at 318px 1112px)`;if(q>=1){A.vis=false;B.clip=null;}}
  }
  return st;
}

const NEU={ty:-113,z:.84,sp:0,sy:576,h:200};
function camState(c){ if(c.n) return NEU;
  const z=c.z+(MODE==='A'?.045:.02); let ty=860-(1129+z*((304+c.sy)-1129));
  const hi=335-1129+900*z, lo=215-1129+900*z;
  ty=Math.min(hi,Math.max(lo,ty));
  return {ty,z,sp:1,sy:c.sy,h:c.h||120}; }
function cam(t){let v=Object.assign({},NEU);for(const c of CFG.CAM||[]){const e=E.inOutCubic(prog(t,c.t,c.t+c.d));if(e<=0)continue;const g=camState(c);
    for(const k of ['ty','z','sp']) v[k]=lerp(v[k],g[k],e);
    if(g.sp>0){v.sy=lerp(v.sy,g.sy,e);v.h=lerp(v.h,g.h,e);} }
  return v;}
function phoneTf(t){
  let tx=0,ty=0,rx=0,ry=0,rz=0,s=1;
  // calm idle drift
  ty+=4*Math.sin(2*PI*t/3.6); ry+=1.8*Math.sin(2*PI*t/5.2+.7); rx+=1.0*Math.sin(2*PI*t/4.4+1.3);
  // entry: smooth arc, no overshoot
  if(t<PIN_IN){ty+=2400;} else {
    const p=prog(t,PIN_IN,PIN_IN+1.2);
    ty+=1250*(1-E.outQuint(p)); tx+=90*(1-E.outCubic(prog(t,PIN_IN,PIN_IN+.85)));
    rx+=16*(1-E.outQuint(p)); rz+=-4*(1-E.outQuint(p)); ry+=-8*(1-E.outQuint(p));
  }
  for(let k=1;k<=6;k++){const x=t-T(k);if(x<0||x>1.1)continue;const b=bump(t,T(k),1.0);
    const ty_=TRANS[k-1];
    if(ty_==='push'){ry+=-4.5*b;tx+=-8*b;}
    if(ty_==='fade'){s*=1+.012*b;rx+=1.5*b;}
    if(ty_==='slideUp'){rx+=-3*b;ty+=-8*b;}
    if(ty_==='reveal'){ry+=3.5*b;s*=1+.01*b;}
  }
  // subtle press response on CTA taps (rigid, uniform)
  for(const tp of bigTaps){ if(tp.t<OUT) s*=1-.006*bump(t,tp.t-.08,.4); }
  // outro: slight lift then glide down
  if(t>=OUT){const x=t-OUT; ty+=-10*bump(t,OUT,.36)*(x<.18?1:0)+(x>=.18?-10*Math.cos(PI*.5*prog(x,.18,.3)):0);
    const q=E.inOutCubic(prog(x,.12,1.0)); ty+=1500*q; rx+=10*q;}
  {const C=cam(t); ty+=C.ty; s*=C.z; if(MODE==='B'){rx+=13*C.sp; ry+=-18*C.sp; rz+=2*C.sp;}}
  return `translate3d(${tx.toFixed(2)}px,${ty.toFixed(2)}px,0) rotateX(${rx.toFixed(3)}deg) rotateY(${ry.toFixed(3)}deg) rotateZ(${rz.toFixed(3)}deg) scale(${s.toFixed(4)})`;
}

function letters(chars,t,tin,tout,{stag=.022,dy=26,dur=.75,blur=10,outStag=.012,outDy=-18,outDur=.45}={}){
  chars.forEach((c,j)=>{
    const a=tin+j*stag; const p=prog(t,a,a+dur); const e=E.outQuint(p);
    let y=dy*(1-e),o=t<a?0:E.outCubic(clamp(p*1.6)),bl=blur*(1-E.outCubic(p));
    if(tout!=null&&t>=tout){const b=tout+j*outStag,q=E.inOutCubic(prog(t,b,b+outDur));y+=outDy*q;o*=1-q;bl+=blur*.8*q;}
    c.style.transform=`translateY(${y.toFixed(2)}px)`; c.style.opacity=o.toFixed(3); c.style.filter=bl>.05?`blur(${bl.toFixed(2)}px)`:'none';
  });
}

function renderAt(t){
  const B=boost(t);
  $('bg').style.opacity=tw(t,0,1.0,0,1,E.inOutCubic).toFixed(3);
  // glow
